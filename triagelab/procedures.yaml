# TriageLab ticket procedures for this repository, applied by GitOps.
# Order is set by procedureRefs on the TicketConnection.
apiVersion: triagelab.bondren.ai/v1alpha1
kind: TicketProcedure
metadata:
  name: edge-failures
  namespace: triagelab
spec:
  workspace: support
  procedure:
    policy:
      tag: edge
      auto_questions: false
      max_questions: 0
      match_condition: '"edge" in ticket.tags || ticket.subject.startsWith("[edge]")'
    evidence:
      - kind: field
        match: Expected
        required: true
        question: 'Expected: What did you expect the edge gateway to do?'
      - kind: field
        match: Actual
        required: true
        question: 'Actual: What happened instead, including the exact error?'
      - kind: attachment
        match: .py
        required: true
        question: Please attach the smallest Python script (.py) that shows the failure.
    clarification: 'To reproduce the edge failure, please reply with the following:'
    default_agent: triagelab-investigator
    sandbox: triagelab-python
    routes: []
---
apiVersion: triagelab.bondren.ai/v1alpha1
kind: TicketProcedure
metadata:
  name: data-loss
  namespace: triagelab
spec:
  workspace: support
  procedure:
    policy:
      tag: data-loss
      auto_questions: false
      max_questions: 0
      match_condition: '"data-loss" in ticket.tags'
      auto_runs: true
      auto_run_condition: '!("needs-review" in ticket.tags) && !("legal-hold" in ticket.tags)'
    evidence:
      - kind: attachment
        match: .py
        required: true
        question: Please attach the sync tool (.py) from the affected deployment.
      - kind: attachment
        match: sync.json
        required: true
        question: Please attach the sync configuration (sync.json).
      - kind: attachment
        match: .txt
        required: true
        required_when: '"needs-replay" in ticket.tags'
        question: Please attach the schema and an export of the affected orders (.txt), with customer details removed, so we can replay the run.
    clarification: 'To replay the failing sync, please reply with the following:'
    default_agent: data-loss-investigator
    sandbox: triagelab-python-replay
    routes: []
---
apiVersion: triagelab.bondren.ai/v1alpha1
kind: TicketProcedure
metadata:
  name: python-timeout
  namespace: triagelab
spec:
  workspace: support
  procedure:
    policy:
      tag: triagelab
      auto_questions: false
      max_questions: 0
    evidence:
      - kind: field
        match: Python version
        pattern: '^3\.12(?:\.[0-9]{1,3})?$'
        required: true
        question: 'Python version: Which Python 3.12 version runs the affected script?'
      - kind: field
        match: Expected
        required: true
        question: 'Expected: What timeout or behavior did you expect?'
      - kind: field
        match: Actual
        required: true
        question: 'Actual: What happened instead, including the exact error if available?'
      - kind: attachment
        match: .py
        required: true
        question: Please attach the smallest Python script (.py) that shows the timeout. Remove secrets and customer data.
    clarification: 'To help us reproduce the timeout, please reply with the following:'
    default_agent: triagelab-investigator
    sandbox: triagelab-python
    routes: []
